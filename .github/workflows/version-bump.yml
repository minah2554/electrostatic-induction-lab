name: Auto Version Bump

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        run: |
          OLD=$(cat VERSION | tr -d '[:space:]')
          IFS='.' read -r MA MI PA <<< "$OLD"
          PA=$((PA+1))
          NEW="$MA.$MI.$PA"
          echo "$NEW" > VERSION
          # index.html 안의 버전 표기 2곳(meta 태그, 푸터 표시 텍스트)을 함께 갱신
          sed -i "s/content=\"$OLD\"/content=\"$NEW\"/" index.html
          sed -i "s/>v$OLD</>v$NEW</" index.html
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION index.html
          if git diff --cached --quiet; then
            echo "No version change to commit."
          else
            git commit -m "chore: bump version to v${{ steps.bump.outputs.new }} [skip ci]"
            git push
          fi
